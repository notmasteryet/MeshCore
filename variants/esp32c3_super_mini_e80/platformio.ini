; ESP32-C3 Super Mini + Ebyte E80-900M2213S (LR1121) module
; https://www.espboards.dev/esp32/esp32-c3-super-mini/
; https://www.cdebyte.com/products/E80-900M2213S
[esp32c3_super_mini_e80_base]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32c3_super_mini_e80
  -D ESP32_CPU_FREQ=80
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_NSS=7
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D RADIO_CLASS=CustomLR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D LORA_TX_POWER=22
  -D RX_BOOSTED_GAIN=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
; battery voltage sense on GPIO0 via 680k (top) + 330k (bottom) voltage divider
; BOT is 315 instead of 330 to compensate for ESP32 ADC reading ~3% low
  -D PIN_VBAT_READ=0
  -D VBAT_DIV_TOP=680
  -D VBAT_DIV_BOT=315
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32c3_super_mini_e80>

[env:esp32c3_super_mini_e80_repeater]
extends = esp32c3_super_mini_e80_base
build_src_filter = ${esp32c3_super_mini_e80_base.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${esp32c3_super_mini_e80_base.build_flags}
  -D ADVERT_NAME='"E80 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"123123"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${esp32c3_super_mini_e80_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
