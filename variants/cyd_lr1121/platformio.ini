; Modified ESP32-2432S028 "Cheap Yellow Display" (classic ESP32, 4 MB flash, no PSRAM)
; + Semtech LR1121 on VSPI. Display ST7789 240x320 + XPT2046 touch on HSPI.
; Pin map: https://github.com/notmasteryet/firmware/tree/cyd-24-v2/variants/esp32/cyd
[CYD_LR1121]
extends = esp32_base
board = esp32dev
; min_spiffs: two 1.9 MB OTA app slots + small filesystem, fits 4 MB flash
board_build.partitions = min_spiffs.csv
build_flags = ${esp32_base.build_flags}
  -I variants/cyd_lr1121
  ; LR1121 (VSPI)
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D P_LORA_NSS=32
  -D P_LORA_RESET=25
  -D P_LORA_DIO_1=35
  -D P_LORA_BUSY=39
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LR11X0_DIO3_TCXO_VOLTAGE=3.0
  ; Display + touch (HSPI)
  -D PIN_TFT_SCK=14
  -D PIN_TFT_MOSI=13
  -D PIN_TFT_MISO=12
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=2
  -D PIN_TFT_BL=27
  -D PIN_TOUCH_CS=33
  -D TFT_SPI_FREQ=40000000
  ; Misc
  -D PIN_USER_BTN=0
  -D PIN_LED_R=4
  -D PIN_LED_G=17
  -D PIN_LED_B=16
  -D PIN_VBAT_READ=34
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/cyd_lr1121>
lib_deps =
  ${esp32_base.lib_deps}

; Companion over BLE with the stock MeshCore screen (bring-up / smoke test)
[env:CYD_LR1121_companion_radio_ble]
extends = CYD_LR1121
build_flags =
  ${CYD_LR1121.build_flags}
  -D LORA_TX_POWER=22
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=CYDDisplay
  -D UI_ZOOM=2
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=16
  -D OFFLINE_QUEUE_SIZE=64
  -D BLE_PIN_CODE=123456
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${CYD_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${CYD_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lovyan03/LovyanGFX @ ^1.2.7

; Companion over USB serial, no screen (radio-only test)
[env:CYD_LR1121_companion_radio_usb]
extends = CYD_LR1121
build_flags =
  ${CYD_LR1121.build_flags}
  -D LORA_TX_POWER=22
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=16
  -D OFFLINE_QUEUE_SIZE=64
build_src_filter = ${CYD_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${CYD_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Bring-up diagnostics: verbose logs, low TX power, dim backlight
[env:CYD_LR1121_companion_radio_ble_debug]
extends = CYD_LR1121
build_flags =
  ${CYD_LR1121.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=CYDDisplay
  -D UI_ZOOM=2
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=16
  -D OFFLINE_QUEUE_SIZE=64
  -D BLE_PIN_CODE=123456
  -D DISABLE_WIFI_OTA=1
  -D LORA_TX_POWER=22
  -D CYD_BRIGHTNESS=160
  -D MESH_DEBUG=1
  -D BLE_DEBUG_LOGGING=1
build_src_filter = ${env:CYD_LR1121_companion_radio_ble.build_src_filter}
lib_deps = ${env:CYD_LR1121_companion_radio_ble.lib_deps}

; MeshSyd: LVGL touch UI (portrait 240x320). Single 3 MB app slot (no OTA).
[env:CYD_LR1121_meshsyd]
extends = CYD_LR1121
board_build.partitions = huge_app.csv
build_flags =
  ${CYD_LR1121.build_flags}
  -I examples/companion_radio/ui-cyd
  -D LV_CONF_INCLUDE_SIMPLE
  -D CYD_LVGL
  -D DISPLAY_CLASS=CYDDisplay
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=16
  -D OFFLINE_QUEUE_SIZE=48
  -D BLE_PIN_CODE=123456
  -D DISABLE_WIFI_OTA=1
  -D LORA_TX_POWER=22
build_src_filter = ${CYD_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-cyd/*.cpp>
  +<../examples/companion_radio/ui-cyd/fonts/*.c>
lib_deps =
  ${CYD_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lovyan03/LovyanGFX @ ^1.2.7
  lvgl/lvgl @ ~8.3.11

[env:CYD_LR1121_meshsyd_debug]
extends = env:CYD_LR1121_meshsyd
build_flags =
  ${env:CYD_LR1121_meshsyd.build_flags}
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
